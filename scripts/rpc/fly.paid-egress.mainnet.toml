app = "everdraw-rpc-egress-mainnet"
primary_region = "sjc"

[build]
  dockerfile = "scripts/rpc/Dockerfile.paid-egress"

[env]
  PORT = "8080"
  RPC_BUDGET_CONFIG_FILE = "/data/rpc-budget-config.json"
  RPC_BUDGET_STATE_FILE = "/data/rpc-budget-state.json"
  RPC_GATEWAY_UPSTREAM_TIMEOUT_MS = "20000"
  RPC_GATEWAY_BODY_LIMIT_BYTES = "1048576"

[mounts]
  source = "everdraw_rpc_budget"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
    force_https = true

  [services.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
