app = "everdraw-keeper-v5"
primary_region = "sjc"

# ADR-0043 (V5 prize auto-compound) redeploy/rewire sequence:
#   1. Operator runs `scripts/redeploy-v5-claim-draw-managers.js` against monadTestnet
#      (deploys new ClaimManagerV5 + DrawManagerV5, calls vault.setDrawManager -- see that
#      script's header comment; setDrawManager is NOT timelocked in the currently deployed
#      PrizeVaultV5 source, so this takes effect immediately).
#   2. Copy the new drawManager/claimManager addresses out of the record the script appended to
#      deployments/monad-testnet.json (the LAST "src/v5" entry with the ADR-0043 role string).
#   3. Fill in DRAW_MANAGER_ADDRESS / CLAIM_MANAGER_ADDRESS / V5_KEEPER_FROM_BLOCK below.
#   4. `flyctl deploy . -c scripts/keeper/fly.v5.uat.toml` to pick up the new env.
#   5. Re-point the indexer (see scripts/indexer/ -- POOL_ADDRESSES / START_BLOCK on the
#      `everdraw-indexer-uat` Fly app) and the frontend (Vercel `everdraw-v5-uat` project,
#      VITE_V5_DRAW_MANAGER_ADDRESS / VITE_V5_CLAIM_MANAGER_ADDRESS) -- see
#      tasks/v5-auto-compound-uat-redeploy-runbook.md for the full ordered sequence.

[build]
  # Resolved relative to this file's dir (scripts/keeper/). Deploy with the repo ROOT as the
  # build context so scripts/, abi/, deployments/ are visible:
  #   flyctl deploy . -c scripts/keeper/fly.v5.uat.toml
  dockerfile = "Dockerfile.v5"

[env]
  NODE_ENV = "production"
  RPC_URL = "https://testnet-rpc.monad.xyz"
  # TODO(ADR-0043 redeploy): replace with the new DrawManagerV5 address from
  # scripts/redeploy-v5-claim-draw-managers.js's deployment record. Prior value (pre-redeploy,
  # pre-auto-compound bytecode): 0x9eb6387EeA7daC93AF9585b5D25bfc7e0A3aD89c
  DRAW_MANAGER_ADDRESS = "TODO_SET_AFTER_ADR_0043_REDEPLOY"
  # TODO(ADR-0043 redeploy): replace with the new ClaimManagerV5 address from the same record.
  # Prior value: 0xF95e319f71B503e396295CD0A55550f56f5901eb
  CLAIM_MANAGER_ADDRESS = "TODO_SET_AFTER_ADR_0043_REDEPLOY"
  # TODO(ADR-0043 redeploy): set to the `startBlock` recorded for the new deployment so the
  # keeper's own event scan doesn't miss the first post-redeploy draw.
  V5_KEEPER_FROM_BLOCK = "TODO_SET_AFTER_ADR_0043_REDEPLOY"
  DEPLOYMENT_FILE = "deployments/monad-testnet.json"
  KEEPER_LOOP = "true"
  KEEPER_INTERVAL_MS = "60000"
  KEEPER_RECENT_CLAIM_WINDOW = "1000"
  # PRIVATE_KEY is intentionally NOT set here. It is the primary-proposer key and must be set as
  # a Fly secret by the operator (never committed, never held by the builder):
  #   flyctl secrets set PRIVATE_KEY=0x<primary-proposer key> -c scripts/keeper/fly.v5.uat.toml

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"

# No [services] block: the keeper is a pure background worker with no inbound HTTP.
