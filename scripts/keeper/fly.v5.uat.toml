app = "everdraw-keeper-v5"
primary_region = "sjc"

# ADR-0043 (V5 prize auto-compound) redeploy/rewire sequence:
#   1. Operator runs `scripts/redeploy-v5-claim-draw-managers.js` against monadTestnet.
#      It deploys new ClaimManagerV5 + DrawManagerV5 and queues the vault draw-manager change.
#   2. Wait PrizeVaultV5.STRATEGY_CHANGE_DELAY, then run:
#        HARDHAT_NETWORK=monadTestnet node scripts/redeploy-v5-claim-draw-managers.js --commit
#      Do not deploy this keeper against the new draw manager until vault.drawManager() verifies
#      the committed address.
#   3. Copy the committed drawManager/claimManager addresses and vault deploy block out of
#      deployments/monad-testnet.json.
#   4. Re-point DRAW_MANAGER_ADDRESS / CLAIM_MANAGER_ADDRESS / V5_KEEPER_FROM_BLOCK with
#      `flyctl secrets set -a everdraw-keeper-v5 ...`. These runtime targets are Fly secrets;
#      do not add competing values to [env].
#   5. Re-point the indexer and frontend after the commit; see
#      tasks/v5-auto-compound-uat-redeploy-runbook.md for the full ordered sequence.
[build]
  # Resolved relative to this file's dir (scripts/keeper/). Deploy with the repo ROOT as the
  # build context so scripts/, abi/, deployments/ are visible:
  #   flyctl deploy . -c scripts/keeper/fly.v5.uat.toml
  dockerfile = "Dockerfile.v5"

[env]
  NODE_ENV = "production"
  RPC_URL = "https://testnet-rpc.monad.xyz"
  # DRAW_MANAGER_ADDRESS, CLAIM_MANAGER_ADDRESS, and V5_KEEPER_FROM_BLOCK are intentionally
  # omitted. They are runtime Fly secrets set together by the re-point runbook. Keeping addresses
  # here is misleading because an existing secret silently overrides the TOML [env] value.
  DEPLOYMENT_FILE = "deployments/monad-testnet.json"
  # Persistent event checkpoint used by keeper-v5.js to avoid rescanning deposit/seed logs from genesis every loop.
  V5_KEEPER_EVENT_CACHE_FILE = "/data/keeper-v5-event-cache.json"
  V5_KEEPER_CLAIM_STATE_FILE = "/data/keeper-v5-claim-state.json"
  KEEPER_LOOP = "true"
  KEEPER_REQUIRE_HEALTHCHECK = "true"
  KEEPER_INTERVAL_MS = "60000"
  KEEPER_RECENT_CLAIM_WINDOW = "1000"
  KEEPER_CLAIM_TRANSIENT_ALERT_THRESHOLD = "3"
  KEEPER_CHAIN_ID = "10143"
  # UAT runs hourly; keep the same minimums and live Pyth-fee-derived guard.
  KEEPER_LOW_BALANCE_WEI = "3000000000000000000"
  KEEPER_LOW_BALANCE_WARN_WEI = "6000000000000000000"
  KEEPER_LOW_BALANCE_DRAW_HEADROOM = "4"
  KEEPER_LOW_BALANCE_WARN_DRAW_HEADROOM = "8"
  KEEPER_BALANCE_GAS_BUFFER_WEI = "100000000000000000"
  KEEPER_CRASH_ALERT_THRESHOLD = "3"
  KEEPER_CRASH_ALERT_WINDOW_MS = "60000"
  KEEPER_ALERT_REPEAT_MS = "3600000"
  TELEGRAM_TIMEOUT_MS = "8000"
  TELEGRAM_RETRIES = "2"
  # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, and KEEPER_HEALTHCHECK_URL and KEEPER_HEALTHCHECK_FAIL_URL are
  # runtime Fly secrets. KEEPER_HEALTHCHECK_URL is mandatory: its external deadline detects a dead machine.
  # Telegram and the separate failure URL cover actionable errors while the machine is still alive.
  # PRIVATE_KEY is intentionally NOT set here. It is the primary-proposer key and must be set as
  # a Fly secret by the operator (never committed, never held by the builder):
  #   flyctl secrets set PRIVATE_KEY=0x<primary-proposer key> -c scripts/keeper/fly.v5.uat.toml

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"

[mounts]
  source = "everdraw_keeper_v5_cache"
  destination = "/data"

# No [services] block: the keeper is a pure background worker with no inbound HTTP.
