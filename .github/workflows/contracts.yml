name: contracts

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
    paths:
      - 'src/**/*.sol'
      - 'lib/**/*.sol'
      - 'abi/**/*.json'
      - 'deployments/**/*.json'
      - 'scripts/check-*.mjs'
      - 'hardhat.config.js'
      - 'foundry.toml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: npm run build
      - run: npm run check:abi
      - run: npm run check:deploy-source
      - run: npm run keeper:v5:test
      - run: npm run draw:watch:test
      - run: forge test
