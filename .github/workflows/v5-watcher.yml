name: v5-root-watcher

on:
  schedule:
    # UAT uses a 15-minute challenge window. Poll at five minutes so a delayed run still leaves
    # operator response time; mainnet uses the longer launch challenge window from ADR-0036.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-root-watcher-uat
  cancel-in-progress: false

jobs:
  recompute-uat-roots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .watcher-cache
          key: v5-root-watcher-uat-${{ github.run_id }}
          restore-keys: |
            v5-root-watcher-uat-
      - run: mkdir -p .watcher-cache
      - run: npm ci
      - name: Recompute UAT root proposals independently
        env:
          DEPLOYMENT_FILE: deployments/monad-testnet.json
          WATCHER_CHAIN_ID: "10143"
          WATCHER_RPC_URL: ${{ secrets.V5_WATCHER_UAT_RPC_URL }}
          WATCHER_LOGS_RPC_URL: ${{ secrets.V5_WATCHER_UAT_LOGS_RPC_URL || secrets.V5_WATCHER_UAT_RPC_URL }}
          WATCHER_HEAD_RPC_URL: https://testnet-rpc.monad.xyz
          WATCHER_HEAD_RPC_TIMEOUT_MS: "10000"
          WATCHER_LOG_CHUNK_SIZE: "100"
          WATCHER_LOG_CONCURRENCY: "1"
          WATCHER_LOG_TIMEOUT_MS: "20000"
          WATCHER_RPC_RETRY_ATTEMPTS: "8"
          WATCHER_RPC_RETRY_BASE_DELAY_MS: "500"
          WATCHER_RPC_RETRY_MAX_DELAY_MS: "10000"
          WATCHER_MIN_VETO_REMAINING_SEC: "300"
          WATCHER_JOB_DURATION_SEC: "3000"
          WATCHER_POLL_INTERVAL_SEC: "60"
          WATCHER_MAX_STALE_SUCCESS_SEC: "600"
          WATCHER_CYCLE_TIMEOUT_SEC: "480"
          WATCHER_SHUTDOWN_RESERVE_SEC: "180"
          WATCHER_MAX_BLOCKS_PER_RUN: "250000"
          WATCHER_STATE_FILE: .watcher-cache/state.json
          WATCHER_HEALTHCHECKS_PING_URL: ${{ secrets.V5_WATCHER_UAT_HEALTHCHECK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          deadline=$((SECONDS + WATCHER_JOB_DURATION_SEC))
          last_success=0

          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            if (( remaining <= WATCHER_SHUTDOWN_RESERVE_SEC )); then
              break
            fi

            cycle_budget=$WATCHER_CYCLE_TIMEOUT_SEC
            max_cycle_budget=$((remaining - WATCHER_SHUTDOWN_RESERVE_SEC))
            if (( cycle_budget > max_cycle_budget )); then
              cycle_budget=$max_cycle_budget
            fi

            timeout --signal=TERM --kill-after=15s "${cycle_budget}s" npm run draw:watch
            status=$?
            now=$SECONDS

            if (( status == 0 )); then
              last_success=$now
            elif (( status == 124 )); then
              echo "::warning::watcher cycle reached its ${cycle_budget}s budget; checkpointed progress will resume next cycle"
            else
              echo "::warning::watcher cycle failed with exit code $status; retrying in ${WATCHER_POLL_INTERVAL_SEC}s"
            fi

            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            sleep_for=$WATCHER_POLL_INTERVAL_SEC
            if (( sleep_for > remaining )); then
              sleep_for=$remaining
            fi
            sleep "$sleep_for"
          done

          if (( last_success == 0 || SECONDS - last_success > WATCHER_MAX_STALE_SUCCESS_SEC )); then
            echo "::error::watcher had no successful chain-head scan in the final ${WATCHER_MAX_STALE_SUCCESS_SEC}s"
            exit 1
          fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: .watcher-cache
          key: v5-root-watcher-uat-${{ github.run_id }}
