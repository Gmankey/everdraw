name: v5-root-watcher-mainnet-canary

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Immutable auditor-approved commit SHA
        required: true
        type: string
      approval_record:
        description: Auditor approval or change-ticket reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v5-root-watcher-mainnet
  cancel-in-progress: false

jobs:
  one-shot-recovery-canary:
    if: vars.V5_WATCHER_MAINNET_ENABLED != 'true' && vars.V5_WATCHER_MAINNET_RECOVERY_APPROVED == 'true'
    environment: v5-mainnet-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging
          persist-credentials: false
      - name: Bind run to approved immutable commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          test -n "$APPROVAL_RECORD"
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .watcher-cache-mainnet
          key: v5-root-watcher-mainnet-${{ inputs.approved_commit }}-${{ github.run_id }}
          restore-keys: |
            v5-root-watcher-mainnet-${{ inputs.approved_commit }}-
      - run: mkdir -p .watcher-cache-mainnet
      - run: npm ci
      - name: Run exactly one bounded recovery canary
        env:
          DEPLOYMENT_FILE: deployments/monad-mainnet.json
          WATCHER_CHAIN_ID: "143"
          WATCHER_HISTORICAL_STATE_RPC_URL: https://rpc2.monad.xyz
          WATCHER_INDEPENDENT_LOGS_RPC_URL: https://rpc2.monad.xyz
          WATCHER_LOGS_RPC_URL: ${{ secrets.V5_WATCHER_MAINNET_LOGS_RPC_URL }}
          WATCHER_HEAD_RPC_URL: https://rpc.monad.xyz
          WATCHER_HEAD_RPC_TIMEOUT_MS: "10000"
          WATCHER_LOG_CHUNK_SIZE: "100"
          WATCHER_INDEPENDENT_LOG_CHUNK_SIZE: "1000"
          WATCHER_LOG_CONCURRENCY: "1"
          WATCHER_LOG_TIMEOUT_MS: "20000"
          WATCHER_RPC_RETRY_ATTEMPTS: "2"
          WATCHER_RPC_RETRY_BASE_DELAY_MS: "500"
          WATCHER_RPC_RETRY_MAX_DELAY_MS: "10000"
          WATCHER_MIN_VETO_REMAINING_SEC: "3600"
          WATCHER_ACKNOWLEDGED_COVERAGE_GAPS: ${{ vars.V5_WATCHER_MAINNET_ACKNOWLEDGED_COVERAGE_GAPS }}
          WATCHER_MAX_BLOCKS_PER_RUN: "250000"
          WATCHER_MAX_TOTAL_BLOCKS_PER_JOB: "250000"
          WATCHER_MAX_RPC_REQUESTS_PER_JOB: "5000"
          WATCHER_MODE: manual-canary
          WATCHER_ALLOW_INDEPENDENT_BOOTSTRAP: "true"
          WATCHER_STATE_FILE: .watcher-cache-mainnet/state.json
          WATCHER_INDEPENDENT_STATE_FILE: .watcher-cache-mainnet/independent-state.json
          WATCHER_HEALTHCHECKS_PING_URL: ${{ secrets.V5_WATCHER_MAINNET_HEALTHCHECK_URL }}
          WATCHER_REQUIRE_CLAIM_PROOF_PUBLISH: "true"
          WATCHER_CLAIM_PROOF_URL: ${{ secrets.V5_CLAIM_PROOF_MAINNET_URL }}
          WATCHER_CLAIM_PROOF_TOKEN: ${{ secrets.V5_CLAIM_PROOF_INGEST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: timeout --signal=TERM --kill-after=15s 720s npm run draw:watch
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: .watcher-cache-mainnet
          key: v5-root-watcher-mainnet-${{ inputs.approved_commit }}-${{ github.run_id }}
