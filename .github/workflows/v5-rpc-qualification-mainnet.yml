name: v5-mainnet-rpc-qualification

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Immutable auditor-approved source commit
        required: true
        type: string
      qualification_id:
        description: Unique auditor-approved qualification identifier
        required: true
        type: string
      evidence_input_path:
        description: Reviewed known-event evidence file in the approved commit
        required: true
        type: string
      provider_period:
        description: Provider billing period identifier approved for this run (for example 2026-11)
        required: true
        type: string
      provider_account_request_cap:
        description: Shared request cap for every qualification in this provider period
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: v5-mainnet-rpc-qualification
  cancel-in-progress: false

jobs:
  qualify:
    environment: v5-mainnet-rpc-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging
          persist-credentials: false
      - name: Bind qualification to immutable reviewed inputs
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          EVIDENCE_INPUT: ${{ inputs.evidence_input_path }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          test -f "$EVIDENCE_INPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .rpc-qualification-admission
          key: v5-rpc-qualification-${{ inputs.provider_period }}-${{ inputs.qualification_id }}-${{ github.run_id }}
          restore-keys: |
            v5-rpc-qualification-${{ inputs.provider_period }}-
      - run: mkdir -p .rpc-qualification-admission tasks/evidence
      - run: npm ci
      - name: Qualify exact production log and historical-state methods
        env:
          DEPLOYMENT_FILE: deployments/monad-mainnet.json
          RPC_QUALIFY_CANDIDATE_URL: https://rpc2.monad.xyz
          RPC_QUALIFY_REFERENCE_URL: ${{ secrets.V5_RPC_QUALIFY_REFERENCE_URL }}
          RPC_QUALIFY_CANONICAL_URL: https://rpc.monad.xyz
          RPC_QUALIFY_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          RPC_QUALIFY_ID: ${{ inputs.qualification_id }}
          RPC_QUALIFY_EVIDENCE_INPUT_FILE: ${{ inputs.evidence_input_path }}
          RPC_QUALIFY_OUTPUT_FILE: tasks/evidence/rpc2-mainnet-qualification.json
          RPC_QUALIFY_ADMISSION_FILE: .rpc-qualification-admission/state.json
          RPC_QUALIFY_PROVIDER_PERIOD: ${{ inputs.provider_period }}
          RPC_QUALIFY_ACCOUNT_REQUEST_CAP: ${{ inputs.provider_account_request_cap }}
          RPC_QUALIFY_COOLDOWN_SEC: "86400"
          RPC_QUALIFY_MAX_REQUESTS: "10000"
          RPC_QUALIFY_LOG_RANGE: "50000"
          RPC_QUALIFY_MIN_REQUEST_INTERVAL_MS: "250"
        run: npm run rpc:qualify:mainnet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rpc2-mainnet-qualification-${{ inputs.qualification_id }}-${{ inputs.approved_commit }}
          path: tasks/evidence/rpc2-mainnet-qualification.json
          if-no-files-found: warn
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: .rpc-qualification-admission
          key: v5-rpc-qualification-${{ inputs.provider_period }}-${{ inputs.qualification_id }}-${{ github.run_id }}
