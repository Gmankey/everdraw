name: v5-mainnet-rpc-qualification

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Immutable auditor-approved source commit
        required: true
        type: string
      qualification_id:
        description: Unique auditor-approved qualification identifier
        required: true
        type: string
      evidence_input_path:
        description: Reviewed known-event evidence file in the approved commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v5-mainnet-rpc-qualification
  cancel-in-progress: false

jobs:
  qualify:
    environment: v5-mainnet-rpc-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging
          persist-credentials: false
      - name: Bind qualification to immutable reviewed inputs
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          EVIDENCE_INPUT: ${{ inputs.evidence_input_path }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          test -f "$EVIDENCE_INPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p tasks/evidence
      - run: npm ci
      - name: Qualify exact production log and historical-state methods
        env:
          DEPLOYMENT_FILE: deployments/monad-mainnet.json
          RPC_QUALIFY_CANDIDATE_URL: https://rpc2.monad.xyz
          RPC_QUALIFY_REFERENCE_URL: ${{ secrets.V5_RPC_QUALIFY_REFERENCE_URL }}
          RPC_QUALIFY_CANONICAL_URL: https://rpc.monad.xyz
          RPC_QUALIFY_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          RPC_QUALIFY_ID: ${{ inputs.qualification_id }}
          RPC_QUALIFY_EVIDENCE_INPUT_FILE: ${{ inputs.evidence_input_path }}
          RPC_QUALIFY_OUTPUT_FILE: tasks/evidence/rpc2-mainnet-qualification.json
          RPC_QUALIFY_ADMISSION_URL: ${{ secrets.V5_RPC_QUALIFY_ADMISSION_URL }}
          RPC_QUALIFY_ADMISSION_TOKEN: ${{ secrets.V5_RPC_QUALIFY_ADMISSION_TOKEN }}
          RPC_QUALIFY_PROVIDER_IDENTITY: ${{ vars.V5_RPC_QUALIFY_PROVIDER_IDENTITY }}
          RPC_QUALIFY_MAX_REQUESTS: "10000"
          RPC_QUALIFY_LOG_RANGE: "50000"
          RPC_QUALIFY_MIN_REQUEST_INTERVAL_MS: "250"
        run: npm run rpc:qualify:mainnet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rpc2-mainnet-qualification-${{ inputs.qualification_id }}-${{ inputs.approved_commit }}
          path: tasks/evidence/rpc2-mainnet-qualification.json
          if-no-files-found: warn
