name: indexer

on:
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/indexer/**'
      - '.github/workflows/indexer.yml'
  push:
    branches: [staging]
    paths:
      - 'scripts/indexer/**'
      - '.github/workflows/indexer.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/indexer/package-lock.json
      - run: npm ci --prefix scripts/indexer
      - run: npm run build --prefix scripts/indexer
      - run: npm test --prefix scripts/indexer
