name: v5-root-watcher-mainnet

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-root-watcher-mainnet
  cancel-in-progress: false

jobs:
  recompute-mainnet-roots:
    if: github.event_name == 'workflow_dispatch' || vars.V5_WATCHER_MAINNET_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .watcher-cache-mainnet
          key: v5-root-watcher-mainnet-${{ github.run_id }}
          restore-keys: |
            v5-root-watcher-mainnet-
      - run: mkdir -p .watcher-cache-mainnet
      - run: npm ci
      - name: Recompute mainnet root proposals independently
        env:
          DEPLOYMENT_FILE: deployments/monad-mainnet.json
          WATCHER_CHAIN_ID: "143"
          WATCHER_RPC_URL: ${{ secrets.V5_WATCHER_MAINNET_RPC_URL }}
          WATCHER_LOGS_RPC_URL: ${{ secrets.V5_WATCHER_MAINNET_LOGS_RPC_URL || secrets.V5_WATCHER_MAINNET_RPC_URL }}
          WATCHER_HEAD_RPC_URL: ${{ secrets.V5_WATCHER_MAINNET_HEAD_RPC_URL }}
          WATCHER_HEAD_RPC_TIMEOUT_MS: "10000"
          WATCHER_LOG_CHUNK_SIZE: "500"
          WATCHER_LOG_CONCURRENCY: "2"
          WATCHER_LOG_TIMEOUT_MS: "20000"
          WATCHER_RPC_RETRY_ATTEMPTS: "8"
          WATCHER_RPC_RETRY_BASE_DELAY_MS: "500"
          WATCHER_RPC_RETRY_MAX_DELAY_MS: "10000"
          WATCHER_MIN_VETO_REMAINING_SEC: "3600"
          WATCHER_JOB_DURATION_SEC: "720"
          WATCHER_POLL_INTERVAL_SEC: "60"
          WATCHER_MAX_STALE_SUCCESS_SEC: "300"
          WATCHER_CYCLE_TIMEOUT_SEC: "300"
          WATCHER_SHUTDOWN_RESERVE_SEC: "90"
          WATCHER_MAX_BLOCKS_PER_RUN: "250000"
          WATCHER_STATE_FILE: .watcher-cache-mainnet/state.json
          WATCHER_HEALTHCHECKS_PING_URL: ${{ secrets.V5_WATCHER_MAINNET_HEALTHCHECK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          deadline=$((SECONDS + WATCHER_JOB_DURATION_SEC))
          last_success=0

          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            if (( remaining <= WATCHER_SHUTDOWN_RESERVE_SEC )); then
              break
            fi

            cycle_budget=$WATCHER_CYCLE_TIMEOUT_SEC
            max_cycle_budget=$((remaining - WATCHER_SHUTDOWN_RESERVE_SEC))
            if (( cycle_budget > max_cycle_budget )); then
              cycle_budget=$max_cycle_budget
            fi

            timeout --signal=TERM --kill-after=15s "${cycle_budget}s" npm run draw:watch
            status=$?
            now=$SECONDS

            if (( status == 0 )); then
              last_success=$now
            elif (( status == 124 )); then
              echo "::warning::mainnet watcher cycle reached its ${cycle_budget}s budget; checkpointed progress will resume next cycle"
            else
              echo "::warning::mainnet watcher cycle failed with exit code $status; retrying in ${WATCHER_POLL_INTERVAL_SEC}s"
            fi

            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            sleep_for=$WATCHER_POLL_INTERVAL_SEC
            if (( sleep_for > remaining )); then
              sleep_for=$remaining
            fi
            sleep "$sleep_for"
          done

          if (( last_success == 0 || SECONDS - last_success > WATCHER_MAX_STALE_SUCCESS_SEC )); then
            echo "::error::mainnet watcher had no successful chain-head scan in the final ${WATCHER_MAX_STALE_SUCCESS_SEC}s"
            exit 1
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .watcher-cache-mainnet
          key: v5-root-watcher-mainnet-${{ github.run_id }}
