name: v5-root-watcher-mainnet

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: v5-root-watcher-mainnet
  cancel-in-progress: false

jobs:
  recompute-mainnet-roots:
    if: vars.V5_WATCHER_MAINNET_ENABLED == 'true' && vars.V5_WATCHER_MAINNET_RECOVERY_APPROVED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .watcher-cache-mainnet
          key: v5-root-watcher-mainnet-${{ github.run_id }}
          restore-keys: |
            v5-root-watcher-mainnet-
      - run: mkdir -p .watcher-cache-mainnet
      - run: npm ci
      - name: Recompute mainnet root proposals independently
        env:
          DEPLOYMENT_FILE: deployments/monad-mainnet.json
          WATCHER_CHAIN_ID: "143"
          WATCHER_HISTORICAL_STATE_RPC_URL: https://rpc2.monad.xyz
          WATCHER_INDEPENDENT_LOGS_RPC_URL: https://rpc2.monad.xyz
          WATCHER_LOGS_RPC_URL: ${{ secrets.V5_WATCHER_MAINNET_LOGS_RPC_URL }}
          WATCHER_HEAD_RPC_URL: https://rpc.monad.xyz
          WATCHER_HEAD_RPC_TIMEOUT_MS: "10000"
          WATCHER_LOG_CHUNK_SIZE: "100"
          WATCHER_INDEPENDENT_LOG_CHUNK_SIZE: "1000"
          WATCHER_LOG_CONCURRENCY: "1"
          WATCHER_LOG_TIMEOUT_MS: "20000"
          WATCHER_RPC_RETRY_ATTEMPTS: "2"
          WATCHER_RPC_RETRY_BASE_DELAY_MS: "500"
          WATCHER_RPC_RETRY_MAX_DELAY_MS: "10000"
          WATCHER_MIN_VETO_REMAINING_SEC: "3600"
          WATCHER_ACKNOWLEDGED_COVERAGE_GAPS: ${{ vars.V5_WATCHER_MAINNET_ACKNOWLEDGED_COVERAGE_GAPS }}
          WATCHER_JOB_DURATION_SEC: "720"
          WATCHER_POLL_INTERVAL_SEC: "60"
          WATCHER_MAX_STALE_SUCCESS_SEC: "300"
          WATCHER_CYCLE_TIMEOUT_SEC: "300"
          WATCHER_SHUTDOWN_RESERVE_SEC: "90"
          WATCHER_MAX_BLOCKS_PER_RUN: "250000"
          WATCHER_MAX_TOTAL_BLOCKS_PER_JOB: "20000"
          WATCHER_MAX_RPC_REQUESTS_PER_JOB: "1500"
          WATCHER_MODE: scheduled
          WATCHER_ALLOW_INDEPENDENT_BOOTSTRAP: "false"
          WATCHER_STATE_FILE: .watcher-cache-mainnet/state.json
          WATCHER_INDEPENDENT_STATE_FILE: .watcher-cache-mainnet/independent-state.json
          WATCHER_HEALTHCHECKS_PING_URL: ${{ secrets.V5_WATCHER_MAINNET_HEALTHCHECK_URL }}
          WATCHER_REQUIRE_CLAIM_PROOF_PUBLISH: "true"
          WATCHER_CLAIM_PROOF_URL: ${{ secrets.V5_CLAIM_PROOF_MAINNET_URL }}
          WATCHER_CLAIM_PROOF_TOKEN: ${{ secrets.V5_CLAIM_PROOF_INGEST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$WATCHER_HISTORICAL_STATE_RPC_URL" || exit 1
          test -n "$WATCHER_INDEPENDENT_LOGS_RPC_URL" || exit 1
          test -n "$WATCHER_LOGS_RPC_URL" || exit 1
          test -n "$WATCHER_HEAD_RPC_URL" || exit 1
          timeout --signal=TERM --kill-after=15s "${WATCHER_CYCLE_TIMEOUT_SEC}s" npm run draw:watch
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: .watcher-cache-mainnet
          key: v5-root-watcher-mainnet-${{ github.run_id }}
