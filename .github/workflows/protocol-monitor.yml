name: protocol-monitor

on:
  pull_request:
    branches: [staging]
    paths:
      - ".github/workflows/protocol-monitor.yml"
      - "deployments/monad-mainnet.json"
      - "scripts/keeper-active-pools.mjs"
      - "scripts/protocol-monitor.js"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run read-only protocol monitor
        env:
          RPC_URL: ${{ secrets.MONAD_MAINNET_RPC_URL || 'https://rpc.monad.xyz' }}
          PROTOCOL_MONITOR_HEALTHCHECK_URL: ${{ secrets.PROTOCOL_MONITOR_HEALTHCHECK_URL }}
          PROTOCOL_MONITOR_HEALTHCHECK_FAIL_URL: ${{ secrets.PROTOCOL_MONITOR_HEALTHCHECK_FAIL_URL }}
        run: npm run protocol:monitor
